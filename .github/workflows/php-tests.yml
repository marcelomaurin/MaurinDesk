name: PHP API tests
on:
  push:
    paths: ['server/php/**', 'tests/http_smoke.py', '.github/workflows/php-tests.yml']
  pull_request:
    paths: ['server/php/**', 'tests/http_smoke.py', '.github/workflows/php-tests.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: Syntax
        run: find server/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Consent and identity tests
        run: php server/php/tests/run.php
      - name: HTTP boundary tests
        run: python3 tests/http_smoke.py
